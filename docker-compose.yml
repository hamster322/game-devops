version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=game
      - POSTGRES_PASSWORD=game
      - POSTGRES_DB=game
    networks:
      - backend
      - db
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=game
      - POSTGRES_PASSWORD=game
      - POSTGRES_DB=game
    networks:
      - backend
      - db
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge

volumes:
  pg_data: