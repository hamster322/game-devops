name: Game Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Сборка и публикация образов
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/game-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/game-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сборка и публикация Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/game-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/game-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max