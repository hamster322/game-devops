version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  api:
    image: hamster32/game-api:latest
    networks:
      - backend
      - db
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=game
      - POSTGRES_PASSWORD=game
      - POSTGRES_DB=game
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  worker:
    image: hamster32/game-worker:latest
    networks:
      - backend
      - db
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=game
      - POSTGRES_PASSWORD=game
      - POSTGRES_DB=game
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:alpine
    networks:
      - backend
    deploy:
      replicas: 1

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  db:
    driver: overlay

volumes:
  pg_data: